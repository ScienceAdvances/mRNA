[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mRNA"
version = "0.1.0"
description = "AnnData-native bulk transcriptomics workflows"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "anndata>=0.13.4", "numpy>=2.5.3", "pandas>=3.0.6",
  "scipy>=1.18.1", "formulaic>=1.2.2",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/ScienceAdvances/mRNA"
Repository = "https://github.com/ScienceAdvances/mRNA"
Issues = "https://github.com/ScienceAdvances/mRNA/issues"

[project.optional-dependencies]
deseq2 = ["pydeseq2>=0.5.4"]
edge = ["edgepython>=0.2.6"]
limma = ["pylimma>=0.2.0"]
enrichment = ["gseapy>=1.3.1"]
activity = ["decoupler>=2.2.0"]
plot = ["matplotlib>=3.11.2"]
all = ["pydeseq2>=0.5.4", "edgepython>=0.2.6", "pylimma>=0.2.0",
       "gseapy>=1.3.1", "decoupler>=2.2.0", "matplotlib>=3.11.2"]
dev = ["pytest>=9", "ruff>=0.16", "build>=1.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/mRNA"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs real optional analysis backends"]
